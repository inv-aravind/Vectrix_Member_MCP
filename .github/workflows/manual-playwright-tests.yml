name: Manual Playwright Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: ''
        required: false
        type: string
      test_command:
        description: 'npm script to run'
        required: false
        default: test:login
        type: choice
        options:
          - test:login

permissions:
  contents: write

concurrency:
  group: manual-playwright-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ github.event.inputs.branch || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Resolve target branch
        id: target
        shell: bash
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          BRANCH_SLUG=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          echo "Running tests against branch: $BRANCH"

      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        env:
          CI: true
        run: npm run ${{ github.event.inputs.test_command || 'test' }}

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Prepare Allure GitHub Pages deploy
        id: pages
        if: always()
        run: bash .github/scripts/publish-allure-pages.sh "${{ github.run_number }}" "${{ steps.target.outputs.branch_slug }}" "${{ steps.target.outputs.branch }}" "${{ github.repository }}"

      - name: Deploy Allure to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-content
          keep_files: false

      - name: Notify webhook
        if: always() && steps.pages.outputs.report_url != ''
        run: bash .github/scripts/notify-webhook.sh "${{ steps.pages.outputs.report_url }}" "${{ steps.pages.outputs.expires_at_iso }}" "${{ github.run_number }}" "${{ steps.target.outputs.branch }}" "${{ github.workflow }}" "${{ job.status }}" "${{ github.event.inputs.test_command || 'test:login' }}"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.target.outputs.branch_slug }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.target.outputs.branch_slug }}-${{ github.run_number }}
          path: test-results/
          retention-days: 1
